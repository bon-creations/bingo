<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ボン・ビンゴ</title>
<style>
:root{--ink:#3b2d4a;--pink:#ff7aa2;--pink-d:#c9557a;--yellow:#ffd54a;--blue:#4fc3f7;--blue-d:#2b93bf;--mint:#7be0b5;--paper:#fffdf7;--gold:#d9a93a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe3ef 0%,#fff8ec 50%,#e3f6ff 100%) fixed;overflow-x:hidden}
.hidden{display:none !important}
.screen{max-width:960px;margin:0 auto;padding:14px;min-height:100vh}
h1{font-size:clamp(2rem,7vw,3.2rem);margin:20px 0 4px;text-align:center;color:var(--pink);text-shadow:2px 2px 0 #fff,4px 4px 0 var(--yellow)}
h2{font-size:1.1rem;margin:14px 0 8px}
h3{margin:0 0 6px;font-size:.95rem}
h1.logo{text-shadow:none;margin:10px auto 0;max-width:460px;width:92%;filter:drop-shadow(0 4px 6px rgba(59,42,107,.35))}
h1.logo svg{width:100%;height:auto;display:block;overflow:visible}
.lb{transform-box:fill-box;transform-origin:center;animation:lbob 1.6s ease-in-out infinite}
@keyframes lbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.2);opacity:1}}
@media(prefers-reduced-motion:reduce){.lb,.tw{animation:none}}
.tagline{text-align:center;margin:0 0 14px;font-weight:bold}
.panel{background:var(--paper);border-radius:20px;padding:14px;box-shadow:0 4px 0 rgba(59,45,74,.15);margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed #e7d9c7}
.row:last-child{border-bottom:none}
.opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.opt{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--yellow)}
.opt:disabled{opacity:.4}
.btn{border:none;border-radius:999px;padding:12px 22px;font:inherit;font-weight:bold;font-size:1.05rem;cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.sub{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn.sub:active{box-shadow:0 1px 0 var(--blue-d)}
.btn.small{padding:6px 12px;font-size:.9rem;box-shadow:0 3px 0 var(--pink-d)}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu .btn{width:100%}
.coinline{text-align:center;font-weight:bold;margin:4px 0 10px}
.topline{display:flex;justify-content:center;align-items:center;gap:14px;margin:10px 0}
.selbox{text-align:center;font-size:.9rem}
.portrait-sm{width:90px;height:100px;position:relative}
.portrait-sm img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.nopic{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-shadow:0 0 4px #0005}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eadbc6;border-radius:14px;padding:8px 10px}
.prow .info{flex:1;min-width:0}
.prow .info b{display:block}
.prow .info small{color:#7a6c85}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;background:#eee;color:#555;margin-left:4px}
.tag.ok{background:var(--mint);color:#1d5a3f}
.tag.lock{background:#ddd;color:#777}
.shopitem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eadbc6;border-radius:14px;padding:8px 10px;margin-bottom:6px}
.shopitem .info{flex:1}
.shopitem small{color:#7a6c85}

/* ゲーム画面 */
#game{position:relative}
#game.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0 10px;font-weight:bold}
.hud-btns{display:flex;gap:6px;flex-wrap:wrap}
.stage{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side{text-align:center}
.side .sname{font-weight:900;font-size:.95rem}
.side .sskill{font-size:11px;color:#6d5c78;line-height:1.3;min-height:28px}
.side .sval{font-size:1.6rem;font-weight:900;color:var(--pink)}
.side.npc .sval{color:#5a6ea8}
.ball{width:clamp(100px,26vw,140px);height:clamp(100px,26vw,140px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--yellow) 13% 100%);border:4px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(59,45,74,.2);margin:0 auto}
.ball .letter{font-size:1rem;font-weight:bold;color:var(--pink)}
.ball .num{font-size:clamp(2.4rem,8vw,3.6rem);font-weight:900;line-height:1}
.ball.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.ticker{text-align:center;min-height:22px;font-size:.9rem;font-weight:bold;color:#7a4a8a;margin:4px 0}
.history{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0;min-height:34px}
.chip{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #d9c9b5;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:bold}
.chip.latest{background:var(--mint);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,210px));justify-content:center;gap:10px}
.card-wrap{min-width:0}
.hdr{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px;text-align:center;font-weight:900;color:var(--pink)}
.hdr div{cursor:default}
.hdr div.targetable{cursor:pointer;background:var(--yellow);border-radius:6px}
.bingo-card{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--ink);padding:6px;border-radius:14px}
.cell{aspect-ratio:1;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:clamp(.8rem,3.4vw,1.05rem);position:relative;color:var(--ink);user-select:none}
.cell.free{background:var(--mint);font-size:.7rem}
.cell.open{background:var(--yellow)}
.cell.open::after{content:"";position:absolute;inset:14%;border-radius:50%;background:rgba(255,122,162,.5)}
.cell.gold{box-shadow:inset 0 0 0 2px #e0a000;background:#fff3c2}
.cell.hint{animation:hintpulse 1s infinite;box-shadow:0 0 0 3px #3f7be0}
@keyframes hintpulse{50%{box-shadow:0 0 0 6px #9fc5ff}}
.cell.flash{animation:flash .6s}
@keyframes flash{0%{box-shadow:0 0 0 6px #fff}100%{box-shadow:0 0 0 0 transparent}}
.cell.pick{outline:3px dashed var(--pink);outline-offset:1px;cursor:pointer}
.items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.items .btn{font-size:.85rem;padding:7px 12px;box-shadow:0 3px 0 var(--blue-d);background:var(--blue)}
.items .btn.dis{opacity:.45}
.log{min-height:52px;font-size:.88rem;line-height:1.5;background:#fff;border-radius:12px;padding:6px 10px;margin:8px 0;border:1px solid #eadbc6}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.target{position:sticky;top:6px;z-index:5;background:var(--pink);color:#fff;border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:bold;margin-bottom:8px}
.target button{background:#fff;color:var(--pink-d);border:none;border-radius:999px;padding:4px 12px;font:inherit;font-weight:bold;cursor:pointer}
.banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) rotate(-4deg) scale(.6);font:900 clamp(2rem,10vw,4rem) system-ui;color:#fff;background:linear-gradient(90deg,#ff7aa2,#ffd54a,#7be0b5,#4fc3f7);padding:10px 30px;border-radius:30px;border:4px solid #fff;box-shadow:0 8px 0 rgba(59,45,74,.35);text-shadow:0 2px 0 #3b2d4a;opacity:0;pointer-events:none;z-index:25;white-space:nowrap;transition:opacity .2s,transform .3s}
.banner.show{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1)}
.toastline{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:16px;font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none;z-index:24;max-width:90vw;text-align:center}
.toastline.show{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:22;transition:opacity .3s}
#flash.on{opacity:.55;transition:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.overlay{position:fixed;inset:0;background:rgba(59,45,74,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay .panel{max-width:440px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.res-title{font-size:2.2rem;font-weight:900;margin:6px 0}
.picker input{font:inherit;font-size:1.6rem;width:140px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:6px}
.nothing{font-size:.9rem;color:#7a6c85}
/* ダウバー（ボンの色で塗る） */
.cell.open[class*="dau-"]::after{inset:14%;border-radius:50%;opacity:.9}
.cell.open.dau-red::after{background:#d63a2f}
.cell.open.dau-yellow::after{background:#e0b019}
.cell.open.dau-blue::after{background:#3f7be0}
.cell.open.dau-green::after{background:#3fa764}
.cell.open.dau-purple::after{background:#8b5cc4}
.cell.open.dau-pink::after{background:#ee7fa8}
.cell.open.dau-rainbow::after{background:conic-gradient(#ff7a7a,#ffd54a,#7be07b,#4fc3f7,#8b5cc4,#ff7a7a)}
/* フレーム（台の枠のデザインから） */
.frm-museum{background:linear-gradient(135deg,#ffb3c6,#ffe6a7,#b7f0d0,#b3d9ff,#d9b3ff);border-radius:16px}
.frm-gold{background:radial-gradient(#fff6c8,#e0b84a);border-radius:16px;box-shadow:0 0 0 3px #b8861c}
.frm-ribbon{background:#fff0f6;border:4px solid #ff7aa2;border-radius:16px;box-shadow:0 0 0 3px #fff,0 0 0 6px #ffb3cc}
.frm-flower{background:radial-gradient(circle,#fff 45%,#ffd6e7 47%);border-radius:16px;box-shadow:inset 0 0 0 4px #ffb0c8}
.frm-nordic{background:repeating-linear-gradient(45deg,#2e4a7a 0 8px,#f2f6fb 8px 16px);border-radius:12px}
.frm-andes{background:repeating-linear-gradient(90deg,#c0522b 0 8px,#f2c14e 8px 14px,#2a7a5a 14px 20px);border-radius:12px}
.frm-asia{background:#b3202a;box-shadow:inset 0 0 0 4px #f2c14e;border-radius:12px}
.gacha{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:2px dashed var(--pink);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.opts-wrap{display:flex;gap:6px;flex-wrap:wrap}
.opts-wrap .opt{min-width:72px}
.bonus{margin-top:10px;padding:8px;border:2px dashed #ffb3cc;border-radius:12px;background:#fff7fb}
.bx-row{display:flex;gap:8px;justify-content:center;margin-top:6px}
.bx{min-width:84px}.bx.hit{outline:3px solid #ee7fa8}
#selName{white-space:pre-line}
.cell.ready{box-shadow:0 0 0 3px #ff7aa2;cursor:pointer;animation:hintpulse 1s infinite}
.howto h2{margin:12px 0 4px;font-size:1.05rem}.howto ul,.howto ol{margin:0;padding-left:1.3em;line-height:1.6;font-size:.92rem}
.meter{font-weight:bold;margin-right:8px}
.cell.chest::before,.cell.coinc::before,.cell.lucky::before{position:absolute;top:0;left:2px;font-size:.62rem;line-height:1}
.cell.chest::before{content:"🎁"}.cell.coinc::before{content:"🪙"}.cell.lucky::before{content:"🍀"}
.bingo-card.cs-red{background:#ffe3df;box-shadow:inset 0 0 0 3px #d63a2f}
.bingo-card.cs-yellow{background:#fff3c4;box-shadow:inset 0 0 0 3px #e0b019}
.bingo-card.cs-blue{background:#dfeaff;box-shadow:inset 0 0 0 3px #3f7be0}
.bingo-card.cs-green{background:#dff5e6;box-shadow:inset 0 0 0 3px #3fa764}
.bingo-card.cs-purple{background:#ece2fa;box-shadow:inset 0 0 0 3px #8b5cc4}
.bingo-card.cs-pink{background:#ffe3ee;box-shadow:inset 0 0 0 3px #ee7fa8}
.bingo-card.cs-rainbow{background:linear-gradient(135deg,#ffe0e0,#fff2c4,#dff5e6,#dfeaff,#ece2fa);box-shadow:inset 0 0 0 3px #b79be0}
#gLeft,#gRight,.cardrow,#cardStack{display:block}
#cardNav,.navbtn{display:none}
#game.land{display:grid;grid-template-columns:minmax(210px,36%) 1fr;column-gap:10px;max-width:none;padding:6px 8px;min-height:0}
#game.land .hud{grid-column:1/-1;margin:2px 0 4px;font-size:.85rem}
#game.land #gLeft{max-height:calc(100vh - 52px);overflow:auto}
#game.land .sskill,#game.land .history{display:none}
#game.land .panel{padding:8px;margin-bottom:6px}
#game.land .portrait-sm{transform:scale(.7);transform-origin:center top;margin-bottom:-24px!important}
#game.land #gRight{min-width:0}
#game.land #cardNav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:4px;font-weight:bold;font-size:.85rem}
#game.land .cardrow{display:flex;align-items:center;gap:4px}
#game.land #cardStack{flex:1;min-width:0}
#game.land .navbtn{display:block;flex:0 0 auto;width:38px;height:96px;border:0;border-radius:12px;background:var(--pink);color:#fff;font-size:1.1rem;font-weight:bold;box-shadow:0 3px 0 var(--pink-d)}
#game.land .navbtn:disabled{opacity:.3}
#game.land .cards{grid-template-columns:repeat(2,minmax(0,176px));justify-content:center;gap:8px}
#game.land .card-wrap h3{margin:0 0 2px;font-size:.8rem}
#game.land .cell{font-size:clamp(.65rem,2.3vw,.95rem)}
#game.land .hud{flex-wrap:wrap;gap:2px 6px;font-size:.72rem}
#game.land .hud-btns{flex-wrap:nowrap;gap:3px}
#game.land .hud .opt{padding:3px 7px;font-size:.72rem;border-width:1.5px}
#game.land .ball{width:78px;height:78px;border-width:3px}
#game.land .ball .num{font-size:1.9rem}
#game.land .ball .letter{font-size:.8rem}
#game.land .stage{gap:2px}
#game.land .portrait-sm{transform:scale(.55);margin-bottom:-38px!important}
#game.land .side .sval{font-size:1.1rem}
#game.land .side .sname{font-size:.75rem}
#game.land .items .btn{padding:4px 8px;font-size:.75rem}
.cell.free{font-size:.6rem}
</style>
</head>
<body>

<!-- タイトル -->
<div id="title" class="screen">
  <h1 aria-label="BON BINGO" class="logo"><svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<linearGradient id="lgR" x1="0" x2="1"><stop offset="0" stop-color="#ff5d8f"/><stop offset=".25" stop-color="#ffb347"/><stop offset=".5" stop-color="#ffe45c"/><stop offset=".75" stop-color="#5fd38d"/><stop offset="1" stop-color="#5aa9ff"/></linearGradient>
<linearGradient id="lgS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g font-family="Arial Black,Impact,Helvetica,sans-serif" font-weight="900" font-size="92" text-anchor="middle" letter-spacing="2">
<text x="284" y="112" fill="#3b2a6b" stroke="#3b2a6b" stroke-width="22" stroke-linejoin="round">BON BINGO</text>
<text x="280" y="108" fill="#fff" stroke="#fff" stroke-width="16" stroke-linejoin="round">BON BINGO</text>
<text x="280" y="108" fill="url(#lgR)" stroke="#3b2a6b" stroke-width="3" stroke-linejoin="round" paint-order="stroke">BON BINGO</text>
<text x="280" y="108" fill="url(#lgS)">BON BINGO</text>
</g>
<g fill="#ffe45c" stroke="#fff" stroke-width="2"><path class="tw" d="M30 40l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path class="tw" style="animation-delay:.6s" d="M530 30l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path class="tw" style="animation-delay:1.2s" d="M520 120l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
<g class="lb" style="animation-delay:0.0s"><circle cx="150" cy="168" r="21" fill="#d63a2f" stroke="#fff" stroke-width="4"/><circle cx="139" cy="153" r="3.5" fill="#fff" opacity=".6"/><text x="150" y="175" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#00000055" stroke-width="1" font-family="Arial Black,Impact,sans-serif">B</text></g><g class="lb" style="animation-delay:0.25s"><circle cx="205" cy="168" r="21" fill="#e0b019" stroke="#fff" stroke-width="4"/><circle cx="194" cy="153" r="3.5" fill="#fff" opacity=".6"/><text x="205" y="175" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#00000055" stroke-width="1" font-family="Arial Black,Impact,sans-serif">I</text></g><g class="lb" style="animation-delay:0.5s"><circle cx="260" cy="168" r="21" fill="#3f7be0" stroke="#fff" stroke-width="4"/><circle cx="249" cy="153" r="3.5" fill="#fff" opacity=".6"/><text x="260" y="175" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#00000055" stroke-width="1" font-family="Arial Black,Impact,sans-serif">N</text></g><g class="lb" style="animation-delay:0.75s"><circle cx="315" cy="168" r="21" fill="#3fa764" stroke="#fff" stroke-width="4"/><circle cx="304" cy="153" r="3.5" fill="#fff" opacity=".6"/><text x="315" y="175" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#00000055" stroke-width="1" font-family="Arial Black,Impact,sans-serif">G</text></g><g class="lb" style="animation-delay:1.0s"><circle cx="370" cy="168" r="21" fill="#8b5cc4" stroke="#fff" stroke-width="4"/><circle cx="359" cy="153" r="3.5" fill="#fff" opacity=".6"/><text x="370" y="175" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#00000055" stroke-width="1" font-family="Arial Black,Impact,sans-serif">O</text></g>
</svg></h1>
  <p class="tagline">ボンたちと一緒にビンゴで勝負しよう！</p>
  <div class="topline">
    <div class="selbox"><div id="selPortrait" class="portrait-sm"></div><div id="selName"></div></div>
  </div>
  <div class="coinline">コイン <span id="coinsTitle">0</span>　／　チケット <span id="tkTitle">0</span>　<small id="tkNext"></small><br><span id="recordTitle"></span></div>
  <div class="panel">
    <div class="menu">
      <button class="btn" data-go="story">ストーリー</button>
      <button class="btn sub" data-go="free">フリービンゴ</button>
      <button class="btn sub" data-go="tournament">トーナメント</button>
      <button class="btn sub" data-go="challenge">チャレンジ</button>
      <button class="btn" data-go="boss" id="btnBoss">ボスビンゴ</button>
      <button class="btn sub" data-go="char">キャラクター</button>
      <button class="btn sub" data-go="shop">アイテムショップ</button>
      <button class="btn sub" data-go="howto">用語と遊び方</button>
      <button class="btn sub" data-go="mission">デイリーミッション</button>
      <button class="btn sub" data-go="titles">称号・実績</button>
      <button class="btn sub" data-go="coll">コレクション</button>
      <button class="btn sub" data-go="sett">設定</button>
    </div>
  </div>
</div>

<!-- 一覧・設定系 -->
<div id="list" class="screen hidden">
  <div class="row"><button class="btn small sub" id="listBack">← タイトル</button><b id="listTitle"></b><span></span></div>
  <div id="listBody"></div>
</div>

<!-- ショップ -->
<div id="shop" class="screen hidden">
  <div class="row"><button class="btn small sub" id="shopBack">← タイトル</button><b>アイテムショップ</b><span id="shopCoins"></span></div>
  <div id="shopBody"></div>
</div>

<!-- コレクション -->
<div id="coll" class="screen hidden">
  <div class="row"><button class="btn small sub" id="collBack">← タイトル</button><b>コレクション</b><span></span></div>
  <div id="collBody"></div>
</div>

<!-- ゲーム -->
<div id="game" class="screen hidden">
  <div class="hud">
    <span id="modeText"></span>
    <span>ラッキー <b id="luckyText">-</b>　ターン <b id="turnText">0 / 30</b>　のこり <b id="deckLeft">75</b>個</span>
    <div class="hud-btns">

  function tone(freq, dur, type, vol, when, on){

    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

    if(!raf) raf = requestAnimationFrame(fxLoop);
  }

    cx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life--; cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.s, p.s*0.6); });
    parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);

  function makeCard(){
    const cols = [];
    for(let c=0;c<5;c++){
      const pool = Array.from({length:15}, (_,i) => c*15+i+1);
      shuffle(pool); cols.push(pool.slice(0,5));

    const spots = shuffle(IDX.flatMap(r => IDX.map(c => [r,c])).filter(([r,c]) => nums[r][c] !== 0));
    const chest = new Set(spots.slice(0,2).map(([r,c]) => r+','+c)), coin = new Set(spots.slice(2,4).map(([r,c]) => r+','+c));
    return {nums, open, done:new Set(), score:0, gold:new Set(), chest, coin};

  /* ===== 対戦の開始 ===== */
  function initItems(count, id){
    const pool = ITEM_KEYS.concat(Object.keys(INTERF));
    const items = {};
    for(let i=0;i<count;i++){
      const weighted = pool.map(k => [k, weightOf(id,k)]);
      const total = weighted.reduce((s,[,w]) => s+w, 0);
      let r = Math.random()*total, pick = pool[0];
      for(const [k,w] of weighted){ if((r -= w) < 0){ pick = k; break; } }
      items[pick] = (items[pick]||0) + 1;
    }
    return items;
  }
  function weightOf(id, k){
    const t = PERSONA[id] || {};
    if(!Object.keys(t).length) return 1;
    return t[k] || 0.2;
  }

  const METER_NEED = 3, METER_MAX = 5;
  const RARE = new Set(['line','golden','double','boost']);
  const itemCost = k => RARE.has(k) ? 5 : 3;
  ITEM_KEYS.forEach(k => { ITEMS[k].desc += RARE.has(k) ? '（★レア：メーター5）' : '（メーター3）'; });
  function startGame(cfg){
    const freeEntry = cfg.mode === 'tournament' && T && T.round > 1;
    tkUpdate();
    if(!freeEntry && save.tk.n < 1){ toast(`チケットがないよ（あと${tkWait()}分で1枚）`); return; }
    beginGame(cfg, [], freeEntry);
  }
  function beginGame(cfg, bring, freeEntry){
    if(!freeEntry){ tkUpdate(); save.tk.n--; writeSave(); }
    const deck = shuffle(Array.from({length:75}, (_,i) => i+1));
    const d = DIFF[cfg.diff] || DIFF.normal;
    const pChar = save.sel;
    const mk = n => Array.from({length:n}, () => makeCard());
    G = {
      cfg, mode:cfg.mode, deck, drawn:[], turn:0, maxTurns:cfg.maxTurns, speed:cfg.speed || 'normal',
      paused:false, over:false, useItems:cfg.useItems !== false, itemUsed:false, itemTurn:-1, meter:0, fills:0, lucky:null, coinGain:0,
      ticket:[], rerollNext:false, doubleNext:false, boostLeft:0, cloverNum:null,
      target:null, logs:[], lastFlash:new Set(), hints:new Set(), boss:!!cfg.boss,
      challenge:cfg.challenge || null,
      player:{char:pChar, cards:mk(cfg.cards), adj:0, charm:false, lockTurns:0,
        immuneUntil: pChar === 'nemu' ? 8 : 0, boostLeft:0},
      npc:{id:cfg.opp, char:cfg.opp, name:CHAR[cfg.opp].name, prob:d.prob, act:d.act,
        cards:mk(cfg.npcCards || cfg.cards), items:initItems(d.items, cfg.opp), adj:0, boostLeft:0}
    };
    { const nums = G.player.cards[0].nums.flat().filter(v => v > 0); G.lucky = nums[Math.floor(Math.random() * nums.length)]; }
    $('modeText').textContent = {story:'ストーリー', free:'フリービンゴ', tournament:`トーナメント ${T ? T.round : ''}回戦`, challenge:'チャレンジ：' + (cfg.challenge ? cfg.challenge.name : ''), boss:'ボスビンゴ'}[cfg.mode] || '';
    $('npcTitle').textContent = `${CHAR[cfg.opp].name}（NPC）`;
    $('pauseBtn').textContent = '一時停止';
    $('pauseBtn').setAttribute('aria-pressed', 'false');
    $('result').classList.add('hidden');
    $('pauseBtn').disabled = false;
    cancelTarget(true);
    markSpeed();
    go('game');
    G.logs = [];
    msg(cfg.mode === 'challenge' ? cfg.challenge.desc : `${CHAR[cfg.opp].name}が あらわれた！`);
    applyLand();
    renderAll();
    bgmStart();
    startTimer();
  }

  /* ===== 抽選 ===== */
  function startTimer(){
    stopTimer();
    timer = setInterval(() => { if(G && !G.paused && !G.over) drawNext(); }, SPEEDS[G.speed]);
  }
  function stopTimer(){ clearInterval(timer); timer = null; }

  function nextNumber(){
    if(G.ticket.length){
      const n = G.ticket.shift(); const i = G.deck.indexOf(n);
      if(i >= 0) G.deck.splice(i,1);
      return n;
    }
    if(G.rerollNext){
      G.rerollNext = false;
      const first = G.deck.pop();
      G.deck.splice(Math.floor(Math.random()*(G.deck.length+1)), 0, first);
    }
    return G.deck.pop();
  }

  function special(card, r, c){
    const k = r+','+c;
    if(card.chest && card.chest.has(k)){ card.chest.delete(k); msg('宝箱マス！'); giveRandomItem(true); }
    if(card.coin && card.coin.has(k)){ card.coin.delete(k); G.coinGain = (G.coinGain || 0) + 20; msg('コインマス！ +20コイン'); sfx('item'); }
    if(G.lucky && card.nums[r][c] === G.lucky){ card.score += 50; msg('ラッキーナンバー！ +50pt'); }
  }
  function markCard(card, n, prob, prefix, flash, goldPts){
    let gold = 0;
    for(let r=0;r<5;r++) for(let c=0;c<5;c++){
      if(card.nums[r][c] === n && !card.open[r][c] && Math.random() < prob){
        card.open[r][c] = true;
        if(prefix[0] === 'p') special(card, r, c);
        flash.add(`${prefix}-${r}-${c}`);
        const k = r+','+c;
        if(card.gold.has(k)){ card.gold.delete(k); gold += goldPts; }
      }
    }
    card.score += gold;
    return gold;
  }

  function drawNext(){
    if(!G || G.over || G.paused) return;
    if(G.turn >= G.maxTurns){ stopTimer(); setTimeout(finish, 500); return; }
    const P = G.player, N = G.npc;
    if(P.lockTurns > 0) P.lockTurns--;

    const n = nextNumber();
    G.turn++; G.drawn.push(n); G.cloverNum = null;
    const dbl = G.doubleNext ? 2 : 1; G.doubleNext = false;
    const pmult = dbl * (G.boostLeft > 0 ? 1.5 : 1);
    const nmult = N.boostLeft > 0 ? 1.5 : 1;
    if(G.boostLeft > 0) G.boostLeft--;
    if(N.boostLeft > 0) N.boostLeft--;

    const flash = new Set();
    const goldP = (P.char === 'oko' ? 100 : 50) * dbl;
    if(save.sett.auto){ P.cards.forEach((card, ci) => markCard(card, n, 1, 'p'+ci, flash, goldP)); charge([...flash].filter(k => k[0] === 'p').length); }
    N.cards.forEach((card, ci) => markCard(card, n, N.prob, 'n'+ci, flash, 50));
    let pl = 0, nl = 0;
    P.cards.forEach(card => pl += settleCard(card, G.turn, G.maxTurns, pmult));
    N.cards.forEach(card => nl += settleCard(card, G.turn, G.maxTurns, nmult));
    G.lastFlash = flash;
    sfx('tick');
    say(`${READ_LETTER[LET[Math.floor((n-1)/15)]]}の${n}`);

    if(P.char === 'niji') randomSkill(true);
    if(N.char === 'niji') randomSkill(false);

    if(pl > 0) afterPlayerLines(pl);
    if(nl > 0){ sfx('npc'); msg(`${N.name}がビンゴ！`); }

    npcTurn();
    if(G.boss && G.turn % 10 === 0) npcTurn();

    computeHints();
    renderAll();
    if(G.turn >= G.maxTurns){ stopTimer(); setTimeout(finish, 900); }
  }

  function afterPlayerLines(n){
    bingoFX(n);
    const chance = G.player.char === 'mogu' ? 0.6 : 0.3;
    for(let i=0;i<n;i++) if(Math.random() < chance) giveRandomItem(true);
  }
  function bingoFX(n){
    sfx('bingo');
    say(n > 1 ? 'ビンゴ、ダブル！' : 'ビンゴ！');
    confetti(160);
    const g = $('game'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    const b = $('banner'); b.textContent = n > 1 ? `ビンゴ ×${n}！！` : 'ビンゴ！';
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(bingoFX.tm); bingoFX.tm = setTimeout(() => b.classList.remove('show'), 1000);
    const f = $('flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 120);
    msg(`あなたのビンゴ！ 合計${n}ライン`);
  }

  function randomSkill(isP){
    if(Math.random() > 0.25) return;
    const side = isP ? G.player : G.npc;
    const who = isP ? 'あなた' : G.npc.name;
    const r = Math.random();
    if(r < 0.4){
      side.adj += 10; msg(`にじボンの ちから！ ${who} +10pt`);
    } else if(r < 0.8){
      const cands = [];
      const cards = side.cards;
      cards.forEach((card,ci) => { for(let rr=0;rr<5;rr++) for(let cc=0;cc<5;cc++) if(!card.open[rr][cc] && card.nums[rr][cc]) cands.push([ci,rr,cc]); });
      if(!cands.length) return;
      const [ci,rr,cc] = cands[Math.floor(Math.random()*cands.length)];
      const lines = openCell(cards[ci], rr, cc, isP);
      msg(`にじボンの ちから！ ${who}のマスが開いた`);
      if(lines && isP) afterPlayerLines(lines);
      else if(lines) msg(`${G.npc.name}がビンゴ！`);
    } else {
      if(isP){ giveRandomItem(true); }
      else { const k = randomKey(); G.npc.items[k] = (G.npc.items[k]||0) + 1; }
      msg(`にじボンの ちから！ ${who}がアイテムを獲得`);
    }
  }

  function openCell(card, r, c, isP){
    card.open[r][c] = true;
    const k = r+','+c;
    if(card.gold.has(k)){ card.gold.delete(k); card.score += isP ? (G.player.char === 'oko' ? 100 : 50) : 50; }
    if(isP) special(card, r, c);
    return settleCard(card, G.turn, G.maxTurns, 1);
  }

  function computeHints(){
    G.hints = new Set();
    if(G.player.char !== 'hyoe') return;
    G.player.cards.forEach((card,ci) => {
      LINES.forEach((ln,i) => {
        if(card.done.has(i)) return;
        const left = ln.filter(([r,c]) => !card.open[r][c]);
        if(left.length === 1) G.hints.add(`p${ci}-${left[0][0]}-${left[0][1]}`);
      });
    });
  }

  /* ===== アイテム ===== */
  function randomKey(){ return ITEM_KEYS[Math.floor(Math.random()*ITEM_KEYS.length)]; }
  function giveRandomItem(silent){
    const k = randomKey();
    save.items[k] = (save.items[k] || 0) + 1; writeSave();
    if(!silent) msg(`アイテム獲得：${ITEMS[k].name}`);
    else msg(`アイテムを獲得：${ITEMS[k].name}`);
    sfx('item');
    return k;
  }

  function renderItems(){
    const box = $('items');
    if(!G || G.mode === 'challenge' && G.cfg.useItems === false || !G.useItems){
      box.innerHTML = G && !G.useItems ? '<span class="nothing">このモードではアイテムは使えません</span>' : '';
      return;
    }
    const locked = G.player.lockTurns > 0, ready = G.meter >= METER_NEED;
    const list = ITEM_KEYS.filter(k => (save.items[k] || 0) > 0);
    const meter = `<span class="meter">パワー ${'●'.repeat(G.meter)}${'○'.repeat(METER_MAX - G.meter)}${ready ? ' 使える！' : '（マスを開けてためよう）'}</span>`;
    box.innerHTML = meter + (list.length
      ? list.map(k => `<button class="btn ${locked || G.meter < itemCost(k) ? 'dis' : ''}" data-item="${k}" title="${ITEMS[k].desc}">${RARE.has(k) ? '★' : ''}${ITEMS[k].name} ×${save.items[k]}</button>`).join('')
      : '<span class="nothing">アイテムがありません（ショップで買えるよ）</span>');
    if(locked) box.insertAdjacentHTML('afterbegin', '<span class="nothing">ロック中…次のターンまで使えない</span>');
  }

  function useItem(k){
    if(!G || G.over || G.target) return;
    if(!G.useItems){ msg('このモードではアイテムが使えない'); return; }
    if(G.player.lockTurns > 0){ msg('ロック中！ アイテムは使えない'); return; }
    if(G.itemTurn === G.turn){ toast('アイテムは1ターンに1個までだよ'); return; }
    if(G.meter < itemCost(k)){ toast(`パワーメーターがたりないよ（${G.meter} / ${itemCost(k)}）`); return; }
    if(!(save.items[k] > 0)) return;
    const def = ITEMS[k];
    if(def.target){ setTarget(k); return; }
    spend(k);
    applyItem(k, null);
  }

  function spend(k){
    G.itemUsed = true; G.itemTurn = G.turn;
    if(G.player.char === 'nico' && Math.random() < 0.3){
      msg('にこボンの ちから！ もう一度使えた');
    } else {
      save.items[k]--;
    }
    G.meter = Math.max(0, G.meter - itemCost(k));
    writeSave();
    sfx('item');
  }

  function applyItem(k, arg){
    const P = G.player;
    switch(k){
      case 'clover': {
        const next = G.ticket.length ? G.ticket[0] : G.deck[G.deck.length-1];
        G.cloverNum = next;
        msg(`ラッキークローバー：次の数字は「${next}」…？`); break;
      }
      case 'double': G.doubleNext = true; msg('ダブルナンバー！ 次の抽選は2倍'); break;
      case 'reroll': G.rerollNext = true; msg('リロール！ 次の抽選をやり直す'); break;
      case 'time': G.maxTurns += 5; msg('タイムプラス！ 制限ターン+5'); break;
      case 'box': giveRandomItem(true); msg('アイテムボックスを開けた'); break;
      case 'boost': G.boostLeft = 3; msg('ビンゴブースト！ 3ターンのあいだ報酬1.5倍'); break;
      case 'charm': P.charm = true; msg('お守りを持った！ 次の妨害を防ぐ'); break;
      case 'shuffle': shuffleCards(); msg('シャッフル！ カードの数字が入れ替わった'); break;
      case 'free': {
        const lines = openCell(P.cards[arg.ci], arg.r, arg.c, true);
        msg('フリーマーク！ マスを開けた');
        if(lines) afterPlayerLines(lines);
        break;
      }
      case 'golden': {
        P.cards[arg.ci].gold.add(arg.r+','+arg.c);
        msg('ゴールデンマーク！ そのマスは得点アップ');
        break;
      }
      case 'line': {
        const cands = [];
        P.cards.forEach((card,ci) => { for(let r=0;r<5;r++) if(!card.open[r][arg] && card.nums[r][arg]) cands.push([ci,r]); });
        if(!cands.length){ msg('その列はもう開いてる'); break; }
        const [ci,r] = cands[Math.floor(Math.random()*cands.length)];
        const lines = openCell(P.cards[ci], r, arg, true);
        msg(`ラインブースト！ ${LET[arg]}列のマスを開けた`);
        if(lines) afterPlayerLines(lines);
        break;
      }
      case 'ticket': {
        G.ticket.push(arg);
        msg(`ナンバーチケット！ 次に「${arg}」が出やすい…かも`);
        break;
      }
    }
    G.target = null;
    renderAll();
  }

  function shuffleCards(){
    G.player.cards.forEach(card => {
      for(let c=0;c<5;c++){
        const pos = [];
        for(let r=0;r<5;r++) if(!card.open[r][c] && card.nums[r][c]) pos.push(r);
        const vals = shuffle(pos.map(r => card.nums[r][c]));
        pos.forEach((r,i) => card.nums[r][c] = vals[i]);
      }
    });
  }

  /* 対象選択 */
  function setTarget(k){
    G.target = k;
    const t = ITEMS[k].target;
    $('targetText').textContent = t === 'cell' ? `${ITEMS[k].name}：マスをタップしてね`
      : t === 'col' ? `${ITEMS[k].name}：BINGOの文字をタップしてね` : `${ITEMS[k].name}：数字を入れてね`;
    if(t === 'number') $('targetText').textContent = `${ITEMS[k].name}：数字を入れてね`;
    if(t === 'number'){ openPicker(); }
    else $('targetBar').classList.remove('hidden');
    renderCards();
  }
  function cancelTarget(silent){
    if(!G) return;
    G.target = null;
    $('targetBar').classList.add('hidden');
    $('picker').classList.add('hidden');
    if(!silent) renderAll();
  }
  $('targetCancel').addEventListener('click', () => cancelTarget(false));
  function openPicker(){
    $('pickNum').value = '';
    $('picker').classList.remove('hidden');
    setTimeout(() => $('pickNum').focus(), 50);
  }
  $('pickNo').addEventListener('click', () => cancelTarget(false));
  $('pickOK').addEventListener('click', () => {
    if(!G || G.target !== 'ticket') return cancelTarget(false);
    const n = Number($('pickNum').value);
    if(!Number.isInteger(n) || n < 1 || n > 75){ toast('1〜75の数字を入れてね'); return; }
    if(!G.deck.includes(n)){ toast('その数字はもう出ています'); return; }
    if(G.ticket.includes(n)){ toast('その数字はもう予約済み'); return; }
    spend('ticket');
    $('picker').classList.add('hidden');
    applyItem('ticket', n);
  });

  /* ===== 妨害・NPC行動 ===== */
  function hitPlayer(kind){
    const P = G.player;
    if(G.turn <= P.immuneUntil){ msg('ねむボンの ちからで むこうか！'); return; }
    if(P.charm){ P.charm = false; msg(`${INTERF[kind].name}を お守りが ふせいだ！`); return; }
    if(kind === 'jam'){
      if(P.char === 'tere' && Math.random() < 0.5){ msg('てれボンが ジャミングを ふせいだ！'); return; }
      const cands = [];
      P.cards.forEach((card,ci) => { for(let r=0;r<5;r++) for(let c=0;c<5;c++) if(card.open[r][c] && card.nums[r][c]) cands.push([ci,r,c]); });
      if(!cands.length) return;
      const [ci,r,c] = cands[Math.floor(Math.random()*cands.length)];
      P.cards[ci].open[r][c] = false;
      msg('ジャミング！ マスが閉じられた');
    } else if(kind === 'thief'){
      const dmg = P.char === 'tere' ? 15 : 30;
      P.adj -= dmg; msg(`ドロボー！ あなた -${dmg}pt`);
    } else if(kind === 'lock'){
      P.lockTurns = 1; msg('ロック！ 次のターンはアイテムが使えない');
    }
    sfx('bad');
  }

  function npcTurn(){
    const N = G.npc;
    if(Math.random() > N.act) return;
    const keys = Object.keys(N.items).filter(k => N.items[k] > 0);
    if(!keys.length) return;
    const weights = keys.map(k => weightOf(N.char === 'oko' && G.boss ? 'boss' : N.char, k));
    const total = weights.reduce((s,w) => s+w, 0);
    let r = Math.random()*total, pick = keys[0];
    for(let i=0;i<keys.length;i++){ if((r -= weights[i]) < 0){ pick = keys[i]; break; } }
    N.items[pick]--; if(N.items[pick] <= 0) delete N.items[pick];
    npcUse(pick);
    sfx('npc');
  }

  function npcUse(k){
    const N = G.npc;
    if(k === 'jam' || k === 'thief' || k === 'lock'){
      msg(`${N.name}の ${INTERF[k].name}！`);
      hitPlayer(k); return;
    }
    if(k === 'free' || k === 'golden' || k === 'line'){
      const cands = [];
      N.cards.forEach((card,ci) => { for(let r=0;r<5;r++) for(let c=0;c<5;c++) if(!card.open[r][c] && card.nums[r][c]) cands.push([ci,r,c]); });
      if(!cands.length) return;
      const [ci,r,c] = cands[Math.floor(Math.random()*cands.length)];
      if(k === 'golden'){ N.cards[ci].gold.add(r+','+c); msg(`${N.name}が ゴールデンマーク`); return; }
      const lines = openCell(N.cards[ci], r, c, false);
      msg(`${N.name}が マスを開けた`);
      if(lines){ msg(`${N.name}がビンゴ！`); }
      return;
    }
    if(k === 'box'){ const kk = randomKey(); N.items[kk] = (N.items[kk]||0)+1; msg(`${N.name}が アイテムを拾った`); return; }
    if(k === 'time' || k === 'double'){ N.adj += 20; msg(`${N.name}に ボーナス！`); return; }
    if(k === 'boost'){ N.boostLeft = 3; msg(`${N.name}の ビンゴブースト！`); return; }
    msg(`${N.name}は ${ITEMS[k].name}を使った`);
  }

  /* ===== 表示 ===== */
  function renderAll(){
    $('autoBtn').setAttribute('aria-pressed', String(!!save.sett.auto));
    if(!G) return;
    const b = $('ballEl');
    const n = G.drawn[G.drawn.length-1];
    if(n === undefined){ $('ballLetter').textContent = '?'; $('ballNum').textContent = '-'; }
    else {
      $('ballLetter').textContent = LET[Math.floor((n-1)/15)];
      $('ballNum').textContent = n;
      b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
    }
    $('turnText').textContent = `${G.turn} / ${G.maxTurns}`;
    $('luckyText').textContent = G.lucky || '-';
    $('deckLeft').textContent = G.deck.length;
    $('pScore').textContent = score(G.player);
    $('nScore').textContent = score(G.npc);
    $('pName').textContent = CHAR[G.player.char].name;
    $('pSkill').textContent = CHAR[G.player.char].skill;
    $('nName').textContent = G.npc.name;
    $('nSkill').textContent = G.boss ? 'ボス：10ターンごとに二度行動' : CHAR[G.npc.char].skill;
    $('pPort').innerHTML = portrait(G.player.char);
    $('pPort').className = 'portrait-sm frm-' + save.frame.sel;
    $('nPort').innerHTML = portrait(G.npc.char);
    $('targetBar').classList.toggle('hidden', !G.target || G.target === 'ticket');
    $('ticker').textContent = G.cloverNum ? `予告：次は「${G.cloverNum}」` : (G.doubleNext ? '次の抽選：ポイント2倍' : (G.rerollNext ? '次の抽選：やり直し' : ''));
    $('history').innerHTML = G.drawn.map((x,i) => `<span class="chip${i===G.drawn.length-1?' latest':''}">${x}</span>`).join('');
    renderCards();
    renderItems();
    renderLog();
  }
  function renderLog(){
    if(!G) return;
    $('log').innerHTML = G.logs.map(t => `<div>・${esc(t)}</div>`).join('');
  }
  function cellHTML(card, ci, r, c, isP, flash, hints){
    const v = card.nums[r][c], key = (isP?'p':'n')+ci+'-'+r+'-'+c, k = r+','+c;
    let cls = 'cell';
    if(v === 0) cls += ' free';
    else if(card.open[r][c]) cls += ' open dau-' + save.daub.sel;
    if(flash.has(key)) cls += ' flash';
    if(isP && hints.has(key)) cls += ' hint';
    if(isP && v > 0 && !card.open[r][c] && G && G.drawn.includes(v)) cls += ' ready';
    if(isP && !card.open[r][c] && card.gold.has(k)) cls += ' gold';
    if(isP && !card.open[r][c] && v > 0){ if(card.chest.has(k)) cls += ' chest'; else if(card.coin.has(k)) cls += ' coinc'; else if(G && G.lucky === v) cls += ' lucky'; }
    if(isP && (G.target === 'free' || G.target === 'golden') && !card.open[r][c]) cls += ' pick';
    const data = isP ? ` data-ci="${ci}" data-r="${r}" data-c="${c}"` : '';
    return `<div class="${cls}"${data}>${v === 0 ? 'FREE' : v}</div>`;
  }
  function cardHTML(card, ci, isP, flash, hints){
    const head = LET.map((l,c) => `<div${isP ? ` class="${G && G.target === 'line' ? 'targetable' : ''}" data-hcol="${c}" data-ci="${ci}"` : ''}>${l}</div>`).join('');
    let cells = '';
    for(let r=0;r<5;r++) for(let c=0;c<5;c++) cells += cellHTML(card, ci, r, c, isP, flash, hints);

        const c = Number(hd.dataset.hcol);
        spend('line');
        applyItem('line', c);
      }
      return;
    }
    const cell = e.target.closest('[data-r]');
    if(cell && !G.target){ manualMark(Number(cell.dataset.ci), Number(cell.dataset.r), Number(cell.dataset.c)); return; }
    if(!cell || !G.target) return;
    const ci = Number(cell.dataset.ci), r = Number(cell.dataset.r), c = Number(cell.dataset.c);
    const card = G.player.cards[ci];
    if(G.target === 'free'){
      if(card.open[r][c]){ toast('そのマスはもう開いてるよ'); return; }
      spend('free'); applyItem('free', {ci,r,c}); $('targetBar').classList.add('hidden');
    } else if(G.target === 'golden'){
      if(card.open[r][c]){ toast('開いたマスには付けられないよ'); return; }
      spend('golden'); applyItem('golden', {ci,r,c}); $('targetBar').classList.add('hidden');
    }
  });

  function charge(n){
    if(!G || n <= 0) return;
    const was = G.meter; G.meter = Math.min(METER_MAX, G.meter + n);
    if(was < METER_NEED && G.meter >= METER_NEED){ G.fills++; if(G.fills % 5 === 0){ msg('ボーナス！メーター5回目で無料アイテム'); giveRandomItem(false); } }
  }
  function manualMark(ci, r, c){
    const card = G.player.cards[ci], v = card.nums[r][c];
    if(v === 0 || card.open[r][c]) return;
    if(!G.drawn.includes(v)){ toast('まだ出てない数字だよ'); return; }
    const lines = openCell(card, r, c, true);
    G.lastFlash = new Set([`p${ci}-${r}-${c}`]);
    sfx('tick'); charge(1);
    if(lines) afterPlayerLines(lines);
    computeHints(); renderAll();

  function finish(){
    if(!G || G.over) return;
    G.over = true; stopTimer();
    const P = G.player, N = G.npc;
    const ps = score(P), ns = score(N);
    const lines = lineCount(P.cards);
    let win = ps > ns;
    if(G.challenge) win = G.challenge.check(G);

    let coins = 30 + Math.floor(Math.max(0, ps) / 10) + lines * 5 + (win ? 60 : 0);
    if(G.boss && win) coins += 300;
    coins += (G.coinGain || 0) + Math.max(0, P.cards.length - 1) * 15;
    if(G.mode === 'tournament' && win) coins += 100;

    let bonusMsg = '';
    if(win){
      if(G.mode === 'story'){
        save.story[N.id] = true;
        if(unlock(N.id)) bonusMsg += `${CHAR[N.id].name}が仲間になった！ `;
      }
      if(G.mode === 'boss'){ save.bossDone = true; bonusMsg += 'ボスをたおした！ '; }
      if(G.challenge){ save.challenge[G.challenge.id] = true; }
    }
    if(G.mode === 'tournament' && T){
      if(win && T.round === 4){ coins += 300; save.tournClear++; bonusMsg += 'トーナメント優勝！ '; T = null; }
      else if(!win){ T = null; }
    }
    save.coins += coins;
    save.stats.played++; if(win) save.stats.wins++; save.stats.bingos += lines;
    mAdd('play', 1); if(win) mAdd('win', 1); if(lines) mAdd('line', lines); if(win && G.mode === 'story') mAdd('story', 1);
    G.lastLines = lines; G.lastWin = win;
    writeSave();
    sfx(win ? 'win' : 'lose');
    if(win) say('やったね！');

    $('resTitle').textContent = win ? 'かち！' : (ps === ns ? 'ひきわけ' : 'まけ…');
    $('resText').textContent = `あなた ${ps}pt ／ ${N.name} ${ns}pt`;
    $('resBody').innerHTML = `ビンゴ数：${lines}　獲得コイン：+${coins}<br>${bonusMsg}${G.challenge ? (win ? 'チャレンジ成功！' : 'チャレンジ失敗…') : ''}`;
    const canNext = G.mode === 'tournament' && T && win && T.round < 4;
    $('resNext').classList.toggle('hidden', !canNext);
    if(canNext){ $('resNext').onclick = () => { T.round++; $('result').classList.add('hidden'); startTournamentRound(); }; }
    $('resRetry').classList.toggle('hidden', G.mode === 'tournament' && !!T || G.mode === 'boss' && !win && false);
    $('resRetry').onclick = () => { startGame(G.cfg); };
    $('resTitleBtn').onclick = goTitle;
    $('result').classList.remove('hidden');
    if(win){
      const base = 50 + lines * 20;
      $('resBody').innerHTML += `<div class="bonus"><b>ボーナスラウンド！</b> 箱を1つえらんでね<div class="bx-row">${[0,1,2].map(i => `<button class="btn small bx" data-bx="${i}">？</button>`).join('')}</div></div>`;
      $('resBody').querySelectorAll('.bx').forEach(b => b.addEventListener('click', () => {
        const prizes = shuffle([{t:'coin', v:base, l:`${base}コイン`}, {t:'coin', v:base * 3, l:`${base * 3}コイン`}, {t:'tk', v:1, l:'チケット+1'}]);
        const pick = +b.dataset.bx;
        $('resBody').querySelectorAll('.bx').forEach((x, i) => { x.textContent = prizes[i].l; x.disabled = true; if(i === pick) x.classList.add('hit'); });
        const pz = prizes[pick];
        if(pz.t === 'coin') save.coins += pz.v; else save.tk.n++;
        save.st.bonus++; mAdd('bonus', 1); sfx('win'); writeSave(); checkTitles();
      }));
    }
    checkTitles();
  }

  /* ===== デイリーミッション ===== */
  const MPOOL = [
    {id:'play3', name:'3回あそぶ', key:'play', n:3, coin:60},
    {id:'win2', name:'2回かつ', key:'win', n:2, coin:80},
    {id:'line5', name:'ビンゴを合計5本つくる', key:'line', n:5, coin:80},
    {id:'story1', name:'ストーリーで1回かつ', key:'story', n:1, coin:70},
    {id:'bonus1', name:'ボーナスラウンドを1回あそぶ', key:'bonus', n:1, coin:60},
    {id:'win1', name:'1回かつ', key:'win', n:1, coin:40}
  ];
  const dayStr = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
  function dayMissions(){
    const d = dayStr(); let h = 0; for(const c of d) h = (h * 31 + c.charCodeAt(0)) % 9973;
    const pool = MPOOL.slice(), out = [];
    while(out.length < 3){ h = (h * 7 + 13) % 9973; out.push(pool.splice(h % pool.length, 1)[0]); }
    return out;
  }
  function dailyReset(){ if(save.daily.date !== dayStr()) save.daily = {date:dayStr(), prog:{}, claimed:[], all:false}; }
  function mAdd(key, n){ dailyReset(); save.daily.prog[key] = (save.daily.prog[key] || 0) + n; }
  function openMission(){
    dailyReset(); listHead('デイリーミッション');
    const ms = dayMissions();
    const rows = ms.map(m => {
      const cur = Math.min(m.n, save.daily.prog[m.key] || 0), done = cur >= m.n, got = save.daily.claimed.includes(m.id);
      return `<div class="row"><span>${m.name}<br><small>${cur} / ${m.n}　報酬 ${m.coin}コイン</small></span>
        <button class="btn small" data-claim="${m.id}" ${done && !got ? '' : 'disabled'}>${got ? '受取済' : (done ? '受け取る' : '進行中')}</button></div>`;
    }).join('');
    const all = ms.every(m => save.daily.claimed.includes(m.id));
    $('listBody').innerHTML = `<div class="panel">${rows}
      <div class="row"><span><b>3つ全部達成ボーナス</b><br><small>チケット+2</small></span><b>${save.daily.all ? '受取済' : (all ? '自動で受取' : '—')}</b></div>

  function doGacha(){
    if(save.coins < GACHA_COST){ toast('コインが足りない'); return; }
    save.coins -= GACHA_COST;
    const pool = [];
    DAUBERS.forEach(d => { if(!save.daub.owned.includes(d.id)) pool.push({kind:'daub', id:d.id, name:d.name}); });
    FRAMES.forEach(f => { if(!save.frame.owned.includes(f.id)) pool.push({kind:'frame', id:f.id, name:f.name}); });
    CARDSKINS.forEach(c => { if(!save.cskin.owned.includes(c.id)) pool.push({kind:'cskin', id:c.id, name:c.name}); });
    let text;
    if(!pool.length){
      save.coins += GACHA_DUP_COINS; text = 'ぜんぶ集めた！ コインが戻ったよ';
    } else {
      const pick = pool[Math.floor(Math.random()*pool.length)];
      ({daub:save.daub, frame:save.frame, cskin:save.cskin})[pick.kind].owned.push(pick.id);
      text = `${({daub:'ダウバー', frame:'フレーム', cskin:'カード柄'})[pick.kind]}「${pick.name}」をゲット！`;
    }
    writeSave(); sfx('item'); toast(text); renderShop();
  }

    const storyDone = STORY.filter(x => save.story[x.id]).length;
    const chDone = CHALLENGES.filter(c => save.challenge[c.id]).length;
    const daubs = DAUBERS.map(d => {
      const own = save.daub.owned.includes(d.id), sel = save.daub.sel === d.id;
      return `<button class="opt" data-dsel="${d.id}" ${own?'':'disabled'} aria-pressed="${sel}">${own?d.name:'？？？'}</button>`;
    }).join('');
    const frames = FRAMES.map(f => {
      const own = save.frame.owned.includes(f.id), sel = save.frame.sel === f.id;
      return `<button class="opt" data-fsel="${f.id}" ${own?'':'disabled'} aria-pressed="${sel}">${own?f.name:'？？？'}</button>`;
    }).join('');
    const cskins = CARDSKINS.map(c => {
      const own = save.cskin.owned.includes(c.id), sel = save.cskin.sel === c.id;
      return `<button class="opt" data-csel="${c.id}" ${own?'':'disabled'} aria-pressed="${sel}">${own?c.name:'？？？'}</button>`;
    }).join('');
    $('collBody').innerHTML = `<div class="plist">${chars}</div>
      <div class="panel" style="margin-top:12px"><h2>ダウバー（マーカー）</h2><div class="opts-wrap">${daubs}</div>
      <h2>フレーム（立ち絵の枠）</h2><div class="opts-wrap">${frames}</div>
      <h2>カード柄</h2><div class="opts-wrap">${cskins}</div></div>
      <div class="panel" style="margin-top:12px">
        <div class="row"><span>ストーリー</span><b>${storyDone} / ${STORY.length}</b></div>
        <div class="row"><span>チャレンジ</span><b>${chDone} / ${CHALLENGES.length}</b></div>
        <div class="row"><span>トーナメント優勝</span><b>${save.tournClear}回</b></div>
        <div class="row"><span>ボスビンゴ</span><b>${save.bossDone ? 'クリア' : '未クリア'}</b></div>
        <div class="row"><span>戦績</span><b>${save.stats.played}戦 ${save.stats.wins}勝 / ビンゴ ${save.stats.bingos}回</b></div>
      </div>`;
  }

  $('collBody').addEventListener('click', e => {
    const d = e.target.closest('[data-dsel]');
    if(d){ save.daub.sel = d.dataset.dsel; writeSave(); renderColl(); return; }
    const cs = e.target.closest('[data-csel]');
    if(cs){ save.cskin.sel = cs.dataset.csel; writeSave(); renderColl(); return; }
    const f = e.target.closest('[data-fsel]');
    if(f){ save.frame.sel = f.dataset.fsel; writeSave(); renderColl(); renderTitle(); }
  });

  /* ===== 初期化 ===== */
  // 旧セーブ（プレイヤーキャラ未登録）への保険
  if(!save.owned.includes(save.sel)) save.sel = 'oko';
  writeSave();
  renderTitle();
  go('title');
})();
</script>
</body>
</html>
